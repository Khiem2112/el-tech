<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPcApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="glassWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgPcApex)"/>
  <!-- Dual Chamber PC Case in Snow White -->
  <rect x="105" y="30" width="190" height="235" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Top Glass / Mesh -->
  <rect x="120" y="38" width="160" height="18" rx="4" fill="#e2e8f0"/>
  <!-- Interior Chamber Dark Contrast -->
  <rect x="120" y="65" width="160" height="150" fill="#0f172a" rx="4"/>
  <!-- White AIO Liquid Cooler with Cyan Halo -->
  <circle cx="170" cy="105" r="18" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="170" cy="105" r="12" fill="#0284c7"/>
  <!-- White RGB RAM Sticks -->
  <rect x="198" y="85" width="3" height="40" fill="#38bdf8" rx="1"/>
  <rect x="205" y="85" width="3" height="40" fill="#38bdf8" rx="1"/>
  <!-- White RTX 5080 GPU -->
  <rect x="130" y="140" width="140" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="155" cy="163" r="15" fill="#e2e8f0" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="195" cy="163" r="15" fill="#e2e8f0" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="235" cy="163" r="15" fill="#e2e8f0" stroke="#38bdf8" stroke-width="1"/>
  <text x="195" y="150" font-family="monospace" font-size="6" font-weight="bold" fill="#0284c7" text-anchor="middle">RTX 5080 WHITE</text>
  <!-- Lower Chamber / Fans -->
  <rect x="120" y="222" width="160" height="36" fill="#e2e8f0" rx="3"/>
  <text x="135" y="244" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#0284c7">EL-TECH</text>
  <text x="185" y="244" font-family="monospace" font-size="8" fill="#64748b">APEX GAMING | SNOW EDITION</text>
  <!-- Panoramic Glass Reflection -->
  <polygon points="120,65 240,65 145,220 120,220" fill="url(#glassWhite)"/>
  <!-- Caption Title -->
  <text x="200" y="285" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">EL-TECH APEX GAMING: Core Ultra 7 + RTX 5080</text>
</svg>
