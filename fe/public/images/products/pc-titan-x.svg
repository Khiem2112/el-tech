<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rgbLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgPc)"/>
  <!-- PC Case Outline (Chassis) -->
  <rect x="110" y="30" width="180" height="235" rx="8" fill="#111827" stroke="#374151" stroke-width="2.5"/>
  <!-- Top 360mm Radiator & Fans -->
  <rect x="125" y="38" width="150" height="18" rx="3" fill="#1f2937" stroke="#4b5563"/>
  <circle cx="150" cy="47" r="7" fill="none" stroke="#76b900" stroke-width="1.5"/>
  <circle cx="185" cy="47" r="7" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="220" cy="47" r="7" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Motherboard Interior Area -->
  <rect x="125" y="65" width="150" height="150" fill="#090d16" rx="4"/>
  <!-- AIO Liquid Cooler Pump with LCD Screen -->
  <circle cx="170" cy="105" r="18" fill="#1e293b" stroke="#76b900" stroke-width="2"/>
  <text x="170" y="108" font-family="monospace" font-size="7" font-weight="bold" fill="#76b900" text-anchor="middle">48°C</text>
  <!-- 4 RGB RAM Sticks -->
  <rect x="198" y="85" width="3" height="40" fill="#06b6d4" rx="1"/>
  <rect x="204" y="85" width="3" height="40" fill="#06b6d4" rx="1"/>
  <rect x="210" y="85" width="3" height="40" fill="#8b5cf6" rx="1"/>
  <rect x="216" y="85" width="3" height="40" fill="#8b5cf6" rx="1"/>
  <!-- Vertical Mounted RTX 5090 GPU -->
  <rect x="135" y="138" width="130" height="48" rx="4" fill="#1f2937" stroke="#76b900" stroke-width="1.5"/>
  <circle cx="158" cy="162" r="16" fill="#111827" stroke="#76b900" stroke-width="1"/>
  <circle cx="200" cy="162" r="16" fill="#111827" stroke="#76b900" stroke-width="1"/>
  <circle cx="242" cy="162" r="16" fill="#111827" stroke="#76b900" stroke-width="1"/>
  <text x="200" y="148" font-family="monospace" font-size="6" font-weight="bold" fill="#76b900" text-anchor="middle">GEFORCE RTX 5090</text>
  <!-- PSU Shroud Area -->
  <rect x="125" y="222" width="150" height="36" fill="#1f2937" rx="3" stroke="#374151"/>
  <text x="135" y="244" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#76b900">EL-TECH</text>
  <text x="185" y="244" font-family="monospace" font-size="8" fill="#94a3b8">TITAN X | 1200W PLATINUM</text>
  <!-- Tempered Glass Tint & Gloss Reflection -->
  <polygon points="125,65 240,65 155,220 125,220" fill="url(#glassReflection)"/>
  <!-- Front I/O & Power Button with Green LED ring -->
  <circle cx="275" cy="47" r="3" fill="#76b900"/>
  <!-- Caption Title -->
  <text x="200" y="285" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">EL-TECH TITAN X: AMD 9800X3D + RTX 5090</text>
</svg>
