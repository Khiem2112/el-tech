<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nvGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#9ae000"/>
    </linearGradient>
    <radialGradient id="fanHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGpu)"/>
  <!-- GPU Shroud -->
  <rect x="30" y="80" width="340" height="140" rx="10" fill="url(#metalPlate)" stroke="#374151" stroke-width="2"/>
  <!-- Heatsink fins behind fans -->
  <g stroke="#263040" stroke-width="2">
    <line x1="50" y1="95" x2="50" y2="205"/><line x1="60" y1="95" x2="60" y2="205"/>
    <line x1="70" y1="95" x2="70" y2="205"/><line x1="80" y1="95" x2="80" y2="205"/>
    <line x1="90" y1="95" x2="90" y2="205"/><line x1="100" y1="95" x2="100" y2="205"/>
    <line x1="110" y1="95" x2="110" y2="205"/><line x1="120" y1="95" x2="120" y2="205"/>
    <line x1="130" y1="95" x2="130" y2="205"/><line x1="140" y1="95" x2="140" y2="205"/>
    <line x1="150" y1="95" x2="150" y2="205"/><line x1="160" y1="95" x2="160" y2="205"/>
    <line x1="170" y1="95" x2="170" y2="205"/><line x1="180" y1="95" x2="180" y2="205"/>
    <line x1="190" y1="95" x2="190" y2="205"/><line x1="200" y1="95" x2="200" y2="205"/>
    <line x1="210" y1="95" x2="210" y2="205"/><line x1="220" y1="95" x2="220" y2="205"/>
    <line x1="230" y1="95" x2="230" y2="205"/><line x1="240" y1="95" x2="240" y2="205"/>
    <line x1="250" y1="95" x2="250" y2="205"/><line x1="260" y1="95" x2="260" y2="205"/>
    <line x1="270" y1="95" x2="270" y2="205"/><line x1="280" y1="95" x2="280" y2="205"/>
    <line x1="290" y1="95" x2="290" y2="205"/><line x1="300" y1="95" x2="300" y2="205"/>
    <line x1="310" y1="95" x2="310" y2="205"/><line x1="320" y1="95" x2="320" y2="205"/>
    <line x1="330" y1="95" x2="330" y2="205"/><line x1="340" y1="95" x2="340" y2="205"/>
    <line x1="350" y1="95" x2="350" y2="205"/>
  </g>
  <!-- NVIDIA Green Accent Bar -->
  <rect x="30" y="80" width="340" height="8" rx="4" fill="url(#nvGreen)"/>
  <!-- Fan 1 -->
  <circle cx="95" cy="150" r="45" fill="#090d16" stroke="#4b5563" stroke-width="2"/>
  <circle cx="95" cy="150" r="16" fill="url(#fanHub)" stroke="#76b900" stroke-width="1.5"/>
  <!-- Fan 2 -->
  <circle cx="200" cy="150" r="45" fill="#090d16" stroke="#4b5563" stroke-width="2"/>
  <circle cx="200" cy="150" r="16" fill="url(#fanHub)" stroke="#76b900" stroke-width="1.5"/>
  <!-- Fan 3 -->
  <circle cx="305" cy="150" r="45" fill="#090d16" stroke="#4b5563" stroke-width="2"/>
  <circle cx="305" cy="150" r="16" fill="url(#fanHub)" stroke="#76b900" stroke-width="1.5"/>
  <!-- Backplate cutout and PCIe bracket -->
  <rect x="15" y="70" width="15" height="150" fill="#94a3b8" rx="2"/>
  <!-- Text Labels -->
  <text x="35" y="70" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">ROG STRIX GEFORCE RTX 5090</text>
  <text x="35" y="240" font-family="monospace" font-size="10" fill="#76b900" font-weight="bold">24GB GDDR7 | BLACK EDITION</text>
  <text x="320" y="240" font-family="monospace" font-size="10" fill="#94a3b8">3.5 SLOT</text>
</svg>
