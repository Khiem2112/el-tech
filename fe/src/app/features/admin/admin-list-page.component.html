<section class="list-page"><div class="list-heading"><div><div class="kicker">{{ eyebrow() }}</div><h1>{{ title() }}</h1><p>{{ description() }}</p></div><button class="primary-button" type="button"><lucide-icon name="plus" size="15" /> {{ actionLabel() }}</button></div><div class="toolbar"><div class="search-box"><lucide-icon name="search" size="16" /><input placeholder="Tìm kiếm trong danh sách..." aria-label="Tìm kiếm" /></div><button class="filter-button" type="button"><lucide-icon name="filter" size="15" /> Bộ lọc <span>3</span></button><button class="filter-button" type="button"><lucide-icon name="arrow-up-down" size="15" /> Sắp xếp</button></div><div class="list-card"><div class="list-meta"><strong>{{ rows().length }} bản ghi</strong><span>Cập nhật lần cuối: vừa xong</span></div><div class="table-wrap"><table><thead><tr><th>MÃ ĐỊNH DANH</th><th>TÊN / ĐỐI TƯỢNG</th><th>CHI TIẾT</th><th>GIÁ TRỊ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>@for (row of rows(); track row.code) {<tr><td><a href="#">{{ row.code }}</a></td><td><strong>{{ row.name }}</strong></td><td>{{ row.meta }}</td><td class="amount">{{ row.value }}</td><td><span class="status" [class]="row.tone"><i></i>{{ row.status }}</span></td><td><button class="row-action" type="button" aria-label="Mở chi tiết"><lucide-icon name="arrow-right" size="15" /></button></td></tr>}</tbody></table></div></div></section>
